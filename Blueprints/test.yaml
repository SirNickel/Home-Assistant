blueprint:
  name: Philips Hue Tap - Multi Action Cycle
  description: "Pro Taste bis zu 3 Aktionen.
    Zustand wird in einem Input Text gespeichert.
    Nach Timeout beginnt die Taste wieder bei Aktion 1.
    Version 1.0.10"
  domain: automation

  input:
    main_section:
      name: Allgemeine Einstellungen
      icon: mdi:gear
      input:
        remote:
          name: Hue Tap Switch
          description: Select the Philips Hue Tap Switch
          selector:
            device:
              integration: zha
              manufacturer: Philips
              model: Hue Tap
        state_helper:
          name: State Helper
          description: Create an input text helper within Home Assistant to keep track
            of the last button pressed and its automation run. This avoids mixing fast
            presses from different buttons. **Each switch requires a unique helper!**
          selector:
            entity:
              domain: input_text
        timeout:
          name: Timeout Sekunden
          default: 10
          selector:
            number:
              min: 1
              max: 300
              mode: box

    t1_section:
      name: Taste 1 Aktionen
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        t1_action1:
          selector:
            action: {}
        t1_action2:
          default: []
          selector:
            action: {}
        t1_action3:
          default: []
          selector:
            action: {}

    t2_section:
      name: Taste 2 Aktionen
      icon: mdi:gesture-tap-button
      input:
        t2_action1:
          selector:
            action: {}
        t2_action2:
          default: []
          selector:
            action: {}
        t2_action3:
          default: []
          selector:
            action: {}

    t3_section:
      name: Taste 3 Aktionen
      icon: mdi:gesture-tap-button
      input:
        t3_action1:
          selector:
            action: {}
        t3_action2:
          default: []
          selector:
            action: {}
        t3_action3:
          default: []
          selector:
            action: {}

    t4_section:
      name: Taste 4 Aktionen
      icon: mdi:gesture-tap-button
      input:
        t4_action1:
          selector:
            action: {}
        t4_action2:
          default: []
          selector:
            action: {}
        t4_action3:
          default: []
          selector:
            action: {}

mode: queued
max: 20

trigger:
  - trigger: event.received
    target:
      device_id: !input remote
    options:
      event_type:
        - press_start

variables:
  # Holt die Nummer der Taste (1-4) direkt aus dem Namen der auslösenden Entität (z. B. taste_1 -> 1)
  key: "t{{ trigger.entity_id | regex_findall_index('_([1-4])') }}"
  state_helper_entity: !input state_helper
  timeout_seconds: !input timeout
  now_ts: "{{ now().timestamp() | int }}"

  # Speichert die Inputs
  t1_a1: !input t1_action1
  t1_a2: !input t1_action2
  t1_a3: !input t1_action3
  t2_a1: !input t2_action1
  t2_a2: !input t2_action2
  t2_a3: !input t2_action3
  t3_a1: !input t3_action1
  t3_a2: !input t3_action2
  t3_a3: !input t3_action3
  t4_a1: !input t4_action1
  t4_a2: !input t4_action2
  t4_a3: !input t4_action3

  # Erstellt eine Map, die TRUE zurückgibt, wenn die Aktion existiert UND befüllt ist
  act_exists:
    t1_a1: "{{ t1_a1 is defined and t1_a1 | length > 0 }}"
    t1_a2: "{{ t1_a2 is defined and t1_a2 | length > 0 }}"
    t1_a3: "{{ t1_a3 is defined and t1_a3 | length > 0 }}"
    t2_a1: "{{ t2_a1 is defined and t2_a1 | length > 0 }}"
    t2_a2: "{{ t2_a2 is defined and t2_a2 | length > 0 }}"
    t2_a3: "{{ t2_a3 is defined and t2_a3 | length > 0 }}"
    t3_a1: "{{ t3_a1 is defined and t3_a1 | length > 0 }}"
    t3_a2: "{{ t3_a2 is defined and t3_a2 | length > 0 }}"
    t3_a3: "{{ t3_a3 is defined and t3_a3 | length > 0 }}"
    t4_a1: "{{ t4_a1 is defined and t4_a1 | length > 0 }}"
    t4_a2: "{{ t4_a2 is defined and t4_a2 | length > 0 }}"
    t4_a3: "{{ t4_a3 is defined and t4_a3 | length > 0 }}"

  data: >
    {% set raw = states(state_helper_entity) %}
    {% if raw in ['unknown','unavailable',''] %}
      {{ {"t1":{"s":0,"ts":0},"t2":{"s":0,"ts":0},"t3":{"s":0,"ts":0},"t4":{"s":0,"ts":0}} }}
    {% else %}
      {{ raw | from_json }}
    {% endif %}

  # Aktueller Schritt (vor dem Tasten Drücken) und Zeitpunkt des letzten Tastendrucks
  current_step: "{{ data[key]['s'] | int(0) }}"

  # Wenn das Timeout abgelaufen ist ODER die nächste geplante Aktion laut unserer Map "false" (leer) ist, springe zu 0
  effective_step: >
    {% if (now_ts - data[key]['ts'] | int(0) > timeout_seconds) %}
      0
    {% else %}
      {% set next_act_key = key ~ '_a' ~ (current_step + 1) %}
      {% if act_exists[next_act_key] == 'False' or act_exists[next_act_key] == false %}
        0
      {% else %}
        {{ current_step }}
      {% endif %}
    {% endif %}

  # Nächster Schritt
  # next_step: >
  #   {% set next_act_key = key ~ '_a' ~ (current_step + 1) %}
  #   {% if act_exists[next_act_key] == 'False' or act_exists[next_act_key] == false %}
  #     0
  #   {% else %}
  #     {{ current_step + 1 }}
  #   {% endif %}

action:
  #
  # Taste 1
  #
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ key == 't1' and effective_step | int == 0 }}
        sequence:
          - choose: []
            default: !input t1_action1
          - variables:
              next_state: 1

      - conditions:
          - condition: template
            value_template: >
              {{ key == 't1' and effective_step | int == 1 }}
        sequence:
          - choose: []
            default: !input t1_action2
          - variables:
              next_state: 2

      - conditions:
          - condition: template
            value_template: >
              {{ key == 't1' and effective_step | int == 2 }}
        sequence:
          - choose: []
            default: !input t1_action3
          - variables:
              next_state: 0

      #
      # TASTE 2
      #
      - conditions:
          - condition: template
            value_template: "{{ key == 't2' and effective_step | int == 0 }}"
        sequence:
          - choose: []
            default: !input t2_action1
          - variables:
              next_state: 1

      - conditions:
          - condition: template
            value_template: "{{ key == 't2' and effective_step | int == 1 }}"
        sequence:
          - choose: []
            default: !input t2_action2
          - variables:
              next_state: 2

      - conditions:
          - condition: template
            value_template: "{{ key == 't2' and effective_step | int == 2 }}"
        sequence:
          - choose: []
            default: !input t2_action3
          - variables:
              next_state: 0

      #
      # Taste 3
      #
      - conditions:
          - condition: template
            value_template: >
              {{ key == 't3' and effective_step | int == 0 }}
        sequence:
          - choose: []
            default: !input t3_action1
          - variables:
              next_state: 1

      - conditions:
          - condition: template
            value_template: >
              {{ key == 't3' and effective_step | int == 1 }}
        sequence:
          - choose: []
            default: !input t3_action2
          - variables:
              next_state: 2

      - conditions:
          - condition: template
            value_template: >
              {{ key == 't3' and effective_step | int == 2 }}
        sequence:
          - choose: []
            default: !input t3_action3
          - variables:
              next_state: 0

      #
      # Taste 4
      #
      - conditions:
          - condition: template
            value_template: >
              {{ key == 't4' and effective_step | int == 0 }}
        sequence:
          - choose: []
            default: !input t4_action1
          - variables:
              next_state: 1

      - conditions:
          - condition: template
            value_template: >
              {{ key == 't4' and effective_step | int == 1 }}
        sequence:
          - choose: []
            default: !input t4_action2
          - variables:
              next_state: 2

      - conditions:
          - condition: template
            value_template: >
              {{ key == 't4' and effective_step | int == 2 }}
        sequence:
          - choose: []
            default: !input t4_action3
          - variables:
              next_state: 0

  - service: input_text.set_value
    target:
      entity_id: !input state_helper
    data:
      value: >
        {% set d = data %}
        {% set d = dict(d) %}
        {% set d = d | combine({
          key: {
            's': effective_step | int + 1,
            'ts': now_ts | int
          }
        }) %}
        {{ d | to_json }}
